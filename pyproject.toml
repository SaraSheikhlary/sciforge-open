[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sciforge"
version = "0.4.0"
description = "Deterministic literature retrieval (PubMed, Crossref) and citation verification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SciForge contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Authlib: Streamlit st.login (OIDC) for Live Mode sign-in; SQLAlchemy + psycopg: optional postgres usage-limit
# backend (SCIFORGE_LIVE_QUOTA_BACKEND=postgres via st.connection(type="sql")).
web = ["streamlit>=1.50,<2", "Authlib>=1.3.2", "SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]

[project.scripts]
sciforge = "sciforge.cli:main"

[project.urls]
Homepage = "https://github.com/SaraSheikhlary/sciforge-open"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live xAI tests (D7) are opt-in only and deselected by default; normal and CI
# runs never call the real API (all model tests use FakeModelClient / MockTransport).
addopts = "-ra -m 'not live_xai'"
markers = [
    "live_xai: calls the real xAI API; opt-in only, never run automatically (deselected by default)",
]
